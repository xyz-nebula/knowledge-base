asyncapi: 3.0.0

info:
  title: Real-Time Audio Engine — WebSocket Messages
  version: 1.0.0
  description: >
    Message-level contract for the /v1/audio-stream WebSocket connection.
    The contract describes the messages actually exchanged by the FastAPI
    WebSocket proxy.

defaultContentType: application/json

servers:
  production:
    host: localhost:8000
    protocol: ws
    description: Local FastAPI WebSocket server

channels:
  audioStream:
    address: /v1/audio-stream
    description: >
      Bidirectional WebSocket channel. The client authenticates using the
      token query parameter and may then send control or audio messages.
      The server streams audio frames and may send errors.

    bindings:
      ws:
        method: GET
        query:
          type: object
          required:
            - token
          properties:
            token:
              type: string
              description: JWT authentication token.
            protocol:
              type: string
              enum:
                - audio-engine.v1
              default: audio-engine.v1
              description: Audio engine protocol version.

    messages:
      controlMessage:
        $ref: "#/components/messages/controlMessage"

      audioInputMessage:
        $ref: "#/components/messages/audioInputMessage"

      audioFrame:
        $ref: "#/components/messages/audioFrame"

      errorMessage:
        $ref: "#/components/messages/errorMessage"

      authError:
        $ref: "#/components/messages/authError"

      transcriptMessage:
        $ref: "#/components/messages/transcriptMessage"

operations:
  clientSendsControl:
    action: receive
    channel:
      $ref: "#/channels/audioStream"
    summary: Client sends a control command.
    messages:
      - $ref: "#/channels/audioStream/messages/controlMessage"

  clientSendsAudio:
    action: receive
    channel:
      $ref: "#/channels/audioStream"
    summary: Client sends an input audio chunk to LocalAI.
    messages:
      - $ref: "#/channels/audioStream/messages/audioInputMessage"

  serverStreamsAudio:
    action: send
    channel:
      $ref: "#/channels/audioStream"
    summary: Server streams generated audio frames from LocalAI.
    messages:
      - $ref: "#/channels/audioStream/messages/audioFrame"

  serverSendsError:
    action: send
    channel:
      $ref: "#/channels/audioStream"
    summary: Server reports an error received from LocalAI.
    messages:
      - $ref: "#/channels/audioStream/messages/errorMessage"

  serverSendsAuthError:
    action: send
    channel:
      $ref: "#/channels/audioStream"
    summary: Server rejects the WebSocket authentication or protocol.
    messages:
      - $ref: "#/channels/audioStream/messages/authError"

  serverSendsTranscript:
    action: send
    channel:
      $ref: "#/channels/audioStream"
    summary: >
      Server forwards a completed transcript — either the user's input audio
      transcription or the assistant's spoken response — as it arrives from
      LocalAI.
    messages:
      - $ref: "#/channels/audioStream/messages/transcriptMessage"

components:
  messages:
    controlMessage:
      name: controlMessage
      title: Control Message
      summary: Client control command.
      payload:
        $ref: "#/components/schemas/ControlMessage"

    audioInputMessage:
      name: audioInputMessage
      title: Audio Input Message
      summary: Client input audio chunk forwarded to LocalAI.
      payload:
        $ref: "#/components/schemas/AudioInputMessage"

    audioFrame:
      name: audioFrame
      title: Audio Frame
      summary: Generated audio chunk streamed by the server.
      payload:
        $ref: "#/components/schemas/AudioFrame"

    errorMessage:
      name: errorMessage
      title: Error Message
      summary: Error reported by the server.
      payload:
        $ref: "#/components/schemas/ErrorMessage"

    authError:
      name: authError
      title: Authentication Error
      summary: WebSocket authentication or protocol validation error.
      payload:
        $ref: "#/components/schemas/AuthError"

    transcriptMessage:
      name: transcriptMessage
      title: Transcript Message
      summary: A completed user or assistant transcript.
      payload:
        $ref: "#/components/schemas/TranscriptMessage"

  schemas:
    ControlMessage:
      type: object
      required:
        - type
        - action
      properties:
        type:
          type: string
          const: control
        action:
          type: string
          enum:
            - pause
            - resume
            - stop
            - close
        reason:
          type: string

    AudioInputMessage:
      type: object
      required:
        - type
        - audio
      properties:
        type:
          type: string
          const: audio
        audio:
          type: string
          contentEncoding: base64
          description: Base64-encoded input audio forwarded to LocalAI.

    AudioFrame:
      type: object
      required:
        - type
        - sequence
        - timestamp
        - format
        - payload
      properties:
        type:
          type: string
          const: audio_frame

        sequence:
          type: integer
          format: int64
          minimum: 1

        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.

        format:
          $ref: "#/components/schemas/AudioFormat"

        payload:
          type: string
          contentEncoding: base64
          description: Base64-encoded PCM audio data.

    AudioFormat:
      type: object
      required:
        - codec
        - sample_rate
        - channels
        - bit_depth
      properties:
        codec:
          type: string
          const: pcm_s16le

        sample_rate:
          type: integer
          const: 24000

        channels:
          type: integer
          const: 1

        bit_depth:
          type: integer
          const: 16

    ErrorMessage:
      type: object
      required:
        - type
        - code
        - message
      properties:
        type:
          type: string
          const: error

        code:
          type: string
          const: LOCALAI_ERROR

        message:
          type: string
          description: JSON-serialized LocalAI error object.

    AuthError:
      type: object
      required:
        - type
        - code
        - message
      properties:
        type:
          type: string
          const: auth_error

        code:
          type: string
          enum:
            - invalid_protocol
            - missing_token
            - expired_token
            - invalid_token

        message:
          type: string

    TranscriptMessage:
      type: object
      required:
        - type
        - role
        - text
      properties:
        type:
          type: string
          const: transcript

        role:
          type: string
          enum:
            - user
            - assistant
          description: >
            Who produced the transcript — "user" for input audio
            transcription, "assistant" for the model's spoken response.

        text:
          type: string
          description: The completed transcript text.
