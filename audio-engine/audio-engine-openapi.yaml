openapi: 3.1.0

info:
  title: Real-Time Audio Engine API
  version: 1.0.0

servers:
  - url: ws://localhost:8000
    description: Local WebSocket server

x-websocket-flow:
  description: >
    WebSocket connection flow implemented by the server.
    Authentication is performed from the token query parameter
    after the WebSocket handshake is accepted.

  steps:
    - step: 1
      actor: client
      action: Open WebSocket connection to ws://localhost:8000/v1/audio-stream?token=...

    - step: 2
      actor: server
      action: Accept the WebSocket connection with HTTP 101 Switching Protocols.

    - step: 3
      actor: server
      action: Read the token query parameter and validate the JWT.

    - step: 4a
      actor: server
      condition: token is missing
      action: Close the WebSocket connection with close code 1008 and reason "missing token".

    - step: 4b
      actor: server
      condition: token is invalid
      action: Close the WebSocket connection with close code 1008 and reason "invalid token".

    - step: 5
      actor: client
      action: Send AudioInputMessage or ControlMessage over the same WebSocket connection.

    - step: 6
      actor: server
      action: Forward audio messages to the local AI realtime service.

    - step: 7
      actor: server
      action: Stream AudioFrame messages continuously when audio output is received.

    - step: 8
      actor: server
      condition: local AI realtime service returns an error
      action: Send ErrorMessage over the WebSocket connection.

    - step: 9
      actor: client
      action: Send ControlMessage with action pause, resume, stop, or close.

    - step: 10
      actor: either
      condition: stop, close, or WebSocket disconnection
      action: End the current streaming session.

paths:
  /v1/audio-stream:
    get:
      summary: WebSocket endpoint for realtime audio streaming
      description: >
        WebSocket endpoint implemented by the server.
        The connection is established using the standard HTTP Upgrade handshake.
        After the connection is accepted, the server validates the JWT from
        the `token` query parameter.

        Authentication failures are reported by closing the WebSocket with
        close code 1008 rather than by returning an HTTP 401 response.

      operationId: audioStream
      tags:
        - audio-stream

      parameters:
        - name: token
          in: query
          required: true
          description: JWT access token.
          schema:
            type: string

        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            enum:
              - websocket

        - name: Connection
          in: header
          required: true
          schema:
            type: string
            enum:
              - Upgrade

        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema:
            type: string

        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            enum:
              - "13"

        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          description: >
            Optional WebSocket subprotocol. The server returns the same
            value during WebSocket acceptance.
          schema:
            type: string
            example: audio-engine.v1

      responses:
        "101":
          description: Switching Protocols. The WebSocket connection is established.

        "1008":
          description: >
            WebSocket Policy Violation. Used when the token is missing
            or the JWT is invalid.
          x-websocket-close-code: 1008
          x-websocket-close-reasons:
            - missing token
            - invalid token

components:
  schemas:

    AudioInputMessage:
      type: object
      description: >
        Client-to-server audio message. The encoded audio payload is
        forwarded to the local AI realtime service.
      required:
        - type
        - audio
      properties:
        type:
          type: string
          enum:
            - audio
        audio:
          type: string
          description: Base64-encoded audio payload.
          contentEncoding: base64

    ControlMessage:
      type: object
      description: >
        Client-to-server control message. Pause and resume are accepted
        by the proxy but currently do not trigger a corresponding action
        in the local AI service.
      required:
        - type
        - action
      properties:
        type:
          type: string
          enum:
            - control

        action:
          type: string
          enum:
            - pause
            - resume
            - stop
            - close

        reason:
          type: string
          description: Optional human-readable reason for stop or close.

    AudioFrame:
      type: object
      description: >
        Server-to-client audio message generated from
        `response.output_audio.delta` events received from the local AI
        realtime service.
      required:
        - type
        - sequence
        - timestamp
        - format
        - payload
      properties:
        type:
          type: string
          enum:
            - audio_frame

        sequence:
          type: integer
          format: int64
          description: >
            Monotonically increasing frame counter for the current connection.

        timestamp:
          type: integer
          format: int64
          description: >
            Unix timestamp in milliseconds at the time the frame is sent.

        format:
          $ref: "#/components/schemas/AudioFormat"

        payload:
          type: string
          description: Base64-encoded audio chunk.
          contentEncoding: base64

    AudioFormat:
      type: object
      required:
        - codec
        - sample_rate
        - channels
      properties:
        codec:
          type: string
          enum:
            - pcm_s16le

        sample_rate:
          type: integer
          example: 24000

        channels:
          type: integer
          example: 1

        bit_depth:
          type: integer
          example: 16

    ErrorMessage:
      type: object
      description: Server-to-client error message for local AI service errors.
      required:
        - type
        - code
        - message
      properties:
        type:
          type: string
          enum:
            - error

        code:
          type: string
          example: LOCALAI_ERROR

        message:
          type: string
          description: Serialized local AI error payload.
